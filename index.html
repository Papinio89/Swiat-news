<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Świat w pigułce – Minimalist News</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            background: #fdfdfd;
            line-height: 1.5;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { font-size: 1.4rem; margin: 0; }
        #date-display { font-size: 0.9rem; color: #666; }
        .archive-box {
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #fff;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 14px;
        }
        a {
            color: #1a0dab;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid #eaeaea;
            padding-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌍 Świat w pigułce</h1>
        <div id="date-display">Ładowanie...</div>
    </header>

    <div class="archive-box">
        <label for="archive-select">Archiwum: </label>
        <select id="archive-select" onchange="loadArchiveDate(this.value)">
            <option value="">Dzisiejsze wiadomości</option>
        </select>
    </div>

    <ul id="news-list">
        <li>Pobieranie wiadomości...</li>
    </ul>

    <footer>
        Minimalistyczny aggregator AI • Zasilany przez Gemini Flash
    </footer>

    <script>
        let archiveData = {};

        async function init() {
            try {
                // Pobieramy archiwum, żeby wypełnić listę dat
                const archiveRes = await fetch('archive.json');
                if (archiveRes.ok) {
                    archiveData = await archiveRes.json();
                    const select = document.getElementById('archive-select');
                    
                    // Sortujemy daty malejąco (od najnowszych)
                    const sortedDates = Object.keys(archiveData).sort().reverse();
                    for (const d of sortedDates) {
                        const opt = document.createElement('option');
                        opt.value = d;
                        opt.textContent = archiveData[d].date || d;
                        select.appendChild(opt);
                    }
                }
            } catch (e) {
                console.log("Brak pliku archiwum lub błąd wczytywania.");
            }

            // Ładowanie dzisiejszych newsów
            loadTodayNews();
        }

        async function loadTodayNews() {
            try {
                const res = await fetch('news.json');
                const data = await res.json();
                renderNews(data);
            } catch (e) {
                document.getElementById('news-list').innerHTML = '<li>⚠️ Nie udało się załadować aktualności.</li>';
            }
        }

        function loadArchiveDate(dateKey) {
            if (!dateKey) {
                loadTodayNews();
                return;
            }
            if (archiveData[dateKey]) {
                renderNews(archiveData[dateKey]);
            }
        }

        function renderNews(data) {
            document.getElementById('date-display').textContent = data.date || '';
            const list = document.getElementById('news-list');
            list.innerHTML = '';

            if (!data.items || data.items.length === 0) {
                list.innerHTML = '<li>Brak wiadomości.</li>';
                return;
            }

            data.items.forEach(item => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = item.link || '#';
                a.target = '_blank';
                a.textContent = item.text;
                li.appendChild(a);
                list.appendChild(li);
            });
        }

        init();
    </script>
</body>
</html>
