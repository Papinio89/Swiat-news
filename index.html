<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregator Info</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      max-width: 650px;
      margin: 0 auto;
    }
    header {
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    h1 { font-size: 19px; margin: 0 0 4px 0; }
    #date-subtitle { color: #94a3b8; font-size: 13px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      padding: 12px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 15px;
      line-height: 1.4;
    }
    .loading { color: #94a3b8; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>Agregator Info 🌎</h1>
    <div id="date-subtitle">Ładowanie...</div>
  </header>

  <ul id="news-container">
    <li class="loading">Pobieranie informacji...</li>
  </ul>

  <script>
    fetch('news.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('date-subtitle').textContent = 'Aktualizacja: ' + data.date;
        const container = document.getElementById('news-container');
        
        if (!data.items || data.items.length === 0) {
          container.innerHTML = '<li class="loading">Brak danych</li>';
          return;
        }
        
        container.innerHTML = data.items.map(item => 
          '<li>' + item + '</li>'
        ).join('');
      })
      .catch(() => {
        document.getElementById('news-container').innerHTML = 
          '<li class="loading">Błąd wczytywania. Uruchom akcję w GitHubie.</li>';
      });
  </script>
</body>
</html>
