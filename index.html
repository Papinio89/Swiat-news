<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skrót Info ze Świata</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 12px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 15px; line-height: 1.4; }
    .loading { color: #94a3b8; font-style: italic; }
  </style>
</head>
<body>
  <h1 id="header-title">Skrót info ze świata 🌎</h1>
  <ul id="news-container">
    <li class="loading">Pobieranie najnowszych informacji...</li>
  </ul>

  <script>
    fetch('news.json')
      .then(function(response) { return response.json(); })
      .then(function(data) {
        document.getElementById('header-title').textContent = 'Skrót info ze świata 🌎 ' + data.date;
        var container = document.getElementById('news-container');
        container.innerHTML = data.items.map(function(item) {
          return '<li>' + item + '</li>';
        }).join('');
      })
      .catch(function() {
        document.getElementById('news-container').innerHTML = '<li class="loading">Błąd wczytywania danych. Spróbuj później.</li>';
      });
  </script>
</body>
</html>
