<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Świat w pigułce – Minimalist News</title>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-color: #222;
            --text-muted: #666;
            --border-color: #eaeaea;
            --link-color: #1a0dab;
            --link-visited: #551a8b;
            --input-bg: #fff;
            --btn-hover: #f1f3f4;
            --badge-bg: #f1f3f4;
            --progress-bar: #1a0dab;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #2d2d2d;
            --link-color: #8ab4f8;
            --link-visited: #c58af9;
            --input-bg: #1e1e1e;
            --btn-hover: #2a2a2a;
            --badge-bg: #2a2a2a;
            --progress-bar: #8ab4f8;
        }

        /* Pasek postępu czytania na samej górze */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: transparent;
            z-index: 1000;
        }
        #progress-bar {
            height: 100%;
            background: var(--progress-bar);
            width: 0%;
            transition: width 0.1s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: var(--text-color);
            background: var(--bg-color);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header-left h1 { font-size: 1.4rem; margin: 0 0 4px 0; }
        #date-display { font-size: 0.85rem; color: var(--text-muted); }
        
        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .icon-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .icon-btn:hover { background: var(--btn-hover); }

        .controls-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .archive-box, .search-box {
            flex: 1;
            min-width: 200px;
        }
        select, input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        
        .stats-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
        }
        li a {
            color: var(--link-color);
            text-decoration: none;
            flex: 1;
            transition: color 0.2s, opacity 0.2s;
        }
        li a:hover {
            text-decoration: underline;
        }
        /* Style dla klikniętych/odwiedzonych linków */
        li a:visited {
            color: var(--link-visited);
            opacity: 0.75;
        }
        
        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--badge-bg);
            opacity: 0.7;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .copy-btn:hover { opacity: 1; }

        footer {
            margin-top: 45px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body data-theme="light">

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <header>
        <div class="header-left">
            <h1>🌍 Świat w pigułce</h1>
            <div id="date-display">Ładowanie...</div>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Przełącz motyw">🌙</button>
        </div>
    </header>

    <div class="controls-bar">
        <div class="archive-box">
            <select id="archive-select" onchange="loadArchiveDate(this.value)">
                <option value="">Dzisiejsze wiadomości</option>
            </select>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 Szukaj w nagłówkach..." oninput="filterNews()">
        </div>
    </div>

    <div class="stats-bar">
        <span id="news-count">Liczba nagłówków: 0</span>
        <span id="search-status"></span>
    </div>

    <ul id="news-list">
        <li>Pobieranie wiadomości...</li>
    </ul>

    <footer>
        Minimalistyczny aggregator AI • 0 tokenów przy przeglądaniu
    </footer>

    <script>
        let archiveData = {};
        let currentItems = [];

        // Pasek postępu przewijania strony
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("progress-bar").style.width = scrolled + "%";
        };

        function initTheme() {
            const savedTheme = localStorage.getItem('news_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-toggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('news_theme', next);
            document.getElementById('theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
        }

        async function init() {
            initTheme();
            try {
                const archiveRes = await fetch('archive.json');
                if (archiveRes.ok) {
                    archiveData = await archiveRes.json();
                    const select = document.getElementById('archive-select');
                    const sortedDates = Object.keys(archiveData).sort().reverse();
                    for (const d of sortedDates) {
                        const opt = document.createElement('option');
                        opt.value = d;
                        opt.textContent = archiveData[d].date || d;
                        select.appendChild(opt);
                    }
                }
            } catch (e) {
                console.log("Brak pliku archiwum.");
            }

            loadTodayNews();
        }

        async function loadTodayNews() {
            try {
                const res = await fetch('news.json');
                const data = await res.json();
                processData(data);
            } catch (e) {
                document.getElementById('news-list').innerHTML = '<li>⚠️ Nie udało się załadować aktualności.</li>';
            }
        }

        function loadArchiveDate(dateKey) {
            if (!dateKey) {
                loadTodayNews();
                return;
            }
            if (archiveData[dateKey]) {
                processData(archiveData[dateKey]);
            }
        }

        function processData(data) {
            document.getElementById('date-display').textContent = data.date || '';
            currentItems = data.items || [];
            renderNews(currentItems);
        }

        function renderNews(items) {
            const list = document.getElementById('news-list');
            list.innerHTML = '';

            document.getElementById('news-count').textContent = `Liczba nagłówków: ${items.length}`;

            if (items.length === 0) {
                list.innerHTML = '<li>Brak pasujących wiadomości.</li>';
                return;
            }

            items.forEach((item) => {
                const li = document.createElement('li');
                
                const a = document.createElement('a');
                a.href = item.link || '#';
                a.target = '_blank';
                a.textContent = item.text;
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = 'Kopiuj link';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(item.link);
                    copyBtn.textContent = 'Skopiowano!';
                    setTimeout(() => copyBtn.textContent = 'Kopiuj link', 1500);
                };

                li.appendChild(a);
                li.appendChild(copyBtn);
                list.appendChild(li);
            });
        }

        function filterNews() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = currentItems.filter(item => item.text.toLowerCase().includes(query));
            renderNews(filtered);
            
            const status = document.getElementById('search-status');
            if (query) {
                status.textContent = `Znaleziono: ${filtered.length}`;
            } else {
                status.textContent = '';
            }
        }

        init();
    </script>
</body>
</html>
