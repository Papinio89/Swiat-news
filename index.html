<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalistyczny Agregator Newsów</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      max-width: 650px;
      margin: 0 auto;
    }
    header {
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 19px; margin: 0 0 4px 0; }
    #date-subtitle { color: #94a3b8; font-size: 13px; }
    
    .archive-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .archive-box label { font-size: 11px; color: #94a3b8; }
    #archive-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }

    ul { list-style: none; padding: 0; margin: 0; }
    li {
      padding: 12px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 15px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .news-link {
      font-size: 12px;
      color: #60a5fa;
      text-decoration: none;
      width: fit-content;
    }
    .news-link:hover { text-decoration: underline; }
    .loading { color: #94a3b8; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="header-title">Agregator Info 🌎</h1>
      <div id="date-subtitle">Ładowanie danych...</div>
    </div>
    <div class="archive-box">
      <label for="archive-select">📅 Archiwum:</label>
      <select id="archive-select" onchange="loadArchiveDate(this.value)">
        <option value="">Dzisiejsze (Najnowsze)</option>
      </select>
    </div>
  </header>

  <div class="filters">
    <button class="filter-btn active" onclick="switchCategory('swiat', this)">🌍 Świat</button>
    <button class="filter-btn" onclick="switchCategory('polska', this)">🇵🇱 Polska</button>
    <button class="filter-btn" onclick="switchCategory('finanse', this)">📈 Finanse</button>
    <button class="filter-btn" onclick="switchCategory('technologia', this)">💻 Technologia</button>
  </div>

  <ul id="news-container">
    <li class="loading">Pobieranie najnowszych informacji...</li>
  </ul>

  <script>
    let currentData = null;
    let archiveDatabase = {};
    let currentCategory = 'swiat';

    function renderNews(dataObj, category) {
      currentCategory = category;
      const container = document.getElementById('news-container');
      
      if (!dataObj || !dataObj.categories || !dataObj.categories[category]) {
        container.innerHTML = '<li class="loading">Brak danych dla tej kategorii.</li>';
        return;
      }

      const items = dataObj.categories[category];
      container.innerHTML = items.map(function(item) {
        return '<li>' +
                 '<span>' + item.text + '</span>' +
                 (item.link && item.link !== '#' ? '<a class="news-link" href="' + item.link + '" target="_blank" rel="noopener">🔗 Czytaj źródło</a>' : '') +
               '</li>';
      }).join('');
    }

    function switchCategory(category, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.classList.remove('active');
      });
      btnElement.classList.add('active');
      renderNews(currentData, category);
    }

    function loadArchiveDate(dateKey) {
      if (!dateKey) {
        // Wczytaj najświeższe z news.json
        fetch('news.json')
          .then(res => res.json())
          .then(data => {
            currentData = data;
            document.getElementById('date-subtitle').textContent = 'Aktualizacja z dnia: ' + data.date;
            renderNews(currentData, currentCategory);
          });
        return;
      }

      if (archiveDatabase[dateKey]) {
        currentData = archiveDatabase[dateKey];
        document.getElementById('date-subtitle').textContent = 'Archiwum z dnia: ' + currentData.date;
        renderNews(currentData, currentCategory);
      }
    }

    // Inicjalizacja danych głównych oraz archiwum
    Promise.all([
      fetch('news.json').then(res => res.json()),
      fetch('archive.json').then(res => res.json()).catch(() => ({}))
    ]).then(([latestData, archives]) => {
      currentData = latestData;
      archiveDatabase = archives;
      
      document.getElementById('date-subtitle').textContent = 'Aktualizacja z dnia: ' + latestData.date;
      renderNews(currentData, currentCategory);

      // Wypełnienie listy rozwijanej archiwum
      const select = document.getElementById('archive-select');
      const sortedKeys = Object.keys(archives).sort().reverse();
      
      sortedKeys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = archives[key].date || key;
        select.appendChild(opt);
      });
    }).catch(() => {
      document.getElementById('news-container').innerHTML = '<li class="loading">Błąd wczytywania danych. Uruchom najpierw akcję w GitHubie.</li>';
    });
  </script>
</body>
</html>
