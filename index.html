<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Świat w pigułce – Minimalist News</title>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-color: #222;
            --text-muted: #666;
            --border-color: #eaeaea;
            --link-color: #1a0dab;
            --link-visited: #551a8b;
            --input-bg: #fff;
            --btn-hover: #f1f3f4;
            --badge-bg: #f1f3f4;
            --progress-bar: #1a0dab;
            --star-active: #fbc02d;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #2d2d2d;
            --link-color: #8ab4f8;
            --link-visited: #c58af9;
            --input-bg: #1e1e1e;
            --btn-hover: #2a2a2a;
            --badge-bg: #2a2a2a;
            --progress-bar: #8ab4f8;
            --star-active: #fdd835;
        }

        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: transparent;
            z-index: 1000;
        }
        #progress-bar {
            height: 100%;
            background: var(--progress-bar);
            width: 0%;
            transition: width 0.1s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: var(--text-color);
            background: var(--bg-color);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header-left h1 { font-size: 1.4rem; margin: 0 0 4px 0; }
        #date-display { font-size: 0.85rem; color: var(--text-muted); }
        
        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .icon-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .icon-btn:hover { background: var(--btn-hover); }

        .controls-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .archive-box, .search-box {
            flex: 1;
            min-width: 200px;
        }
        select, input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .tabs-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .tab-btn.active {
            background: var(--link-color);
            color: #fff;
            border-color: var(--link-color);
        }
        [data-theme="dark"] .tab-btn.active {
            color: #121212;
        }
        
        .stats-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--badge-bg);
            padding: 8px 12px;
            border-radius: 6px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
        }
        li a {
            color: var(--link-color);
            text-decoration: none;
            flex: 1;
            transition: color 0.2s, opacity 0.2s;
        }
        li a:hover {
            text-decoration: underline;
        }
        li a:visited {
            color: var(--link-visited);
            opacity: 0.75;
        }
        
        .actions-group {
            display: flex;
            gap: 6px;
            align-items: center;
            white-space: nowrap;
        }
        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 4px;
            opacity: 0.4;
            transition: opacity 0.2s;
        }
        .star-btn.starred {
            opacity: 1;
        }
        .star-btn:hover { opacity: 1; }

        .copy-btn {
            background: var(--badge-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 3px 6px;
            border-radius: 4px;
            transition: opacity 0.2s;
        }
        .copy-btn:hover { opacity: 1; }

        footer {
            margin-top: 45px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body data-theme="light">

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <header>
        <div class="header-left">
            <h1>🌍 Świat w pigułce</h1>
            <div id="date-display">Ładowanie...</div>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Przełącz motyw">🌙</button>
        </div>
    </header>

    <div class="controls-bar">
        <div class="archive-box">
            <select id="archive-select" onchange="loadArchiveSession(this.value)">
                <option value="">Najnowsze wydanie</option>
            </select>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 Szukaj w nagłówkach..." oninput="filterNews()">
        </div>
    </div>

    <div class="tabs-bar">
        <button class="tab-btn active" id="tab-all" onclick="switchTab('all')">Wszystkie newsy</button>
        <button class="tab-btn" id="tab-starred" onclick="switchTab('starred')">⭐ Na potem (<span id="starred-count">0</span>)</button>
    </div>

    <div class="stats-bar">
        <span id="progress-text">Postęp: 0% (0/0)</span>
        <span id="comment-text" style="font-weight: 500;">Zaczynamy!</span>
    </div>

    <ul id="news-list">
        <li>Pobieranie wiadomości...</li>
    </ul>

    <footer>
        Minimalistyczny aggregator AI • 0 tokenów przy przeglądaniu
    </footer>

    <script>
        let archiveData = {};
        let currentItems = [];
        let activeTab = 'all';
        let starredLinks = JSON.parse(localStorage.getItem('starred_news') || '[]');

        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("progress-bar").style.width = scrolled + "%";
        };

        function initTheme() {
            const savedTheme = localStorage.getItem('news_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-toggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('news_theme', next);
            document.getElementById('theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
        }

        async function init() {
            initTheme();
            try {
                const archiveRes = await fetch('archive.json');
                if (archiveRes.ok) {
                    archiveData = await archiveRes.json();
                    const select = document.getElementById('archive-select');
                    
                    // Sortowanie sesji malejąco (najnowsze u góry)
                    const sortedKeys = Object.keys(archiveData).sort().reverse();
                    for (const key of sortedKeys) {
                        const item = archiveData[key];
                        const opt = document.createElement('option');
                        opt.value = key;
                        
                        // Ładne nazewnictwo w rozwijanej liście (Data + Godzina pobrania)
                        let sessionType = (item.time && item.time.startsWith("0")) ? "🌅 Poranne" : "🌆 Wieczorne";
                        opt.textContent = `${item.date || key} (${sessionType} - ${item.time || '19:00'})`;
                        select.appendChild(opt);
                    }
                }
            } catch (e) {
                console.log("Brak pliku archiwum.");
            }

            loadLatestNews();
        }

        async function loadLatestNews() {
            try {
                const res = await fetch('news.json');
                const data = await res.json();
                processData(data);
            } catch (e) {
                document.getElementById('news-list').innerHTML = '<li>⚠️ Nie udało się załadować aktualności.</li>';
            }
        }

        function loadArchiveSession(sessionKey) {
            if (!sessionKey) {
                loadLatestNews();
                return;
            }
            if (archiveData[sessionKey]) {
                processData(archiveData[sessionKey]);
            }
        }

        function processData(data) {
            let timeInfo = data.time ? ` • Pobrano o ${data.time}` : '';
            document.getElementById('date-display').textContent = (data.date || '') + timeInfo;
            currentItems = data.items || [];
            renderNews();
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tab-all').classList.toggle('active', tab === 'all');
            document.getElementById('tab-starred').classList.toggle('active', tab === 'starred');
            renderNews();
        }

        function toggleStar(link) {
            if (starredLinks.includes(link)) {
                starredLinks = starredLinks.filter(l => l !== link);
            } else {
                starredLinks.push(link);
            }
            localStorage.setItem('starred_news', JSON.stringify(starredLinks));
            renderNews();
        }

        function renderNews() {
            const list = document.getElementById('news-list');
            list.innerHTML = '';

            // Obsługa licznika gwiazdek
            document.getElementById('starred-count').textContent = starredLinks.length;

            let itemsToDisplay = currentItems;
            if (activeTab === 'starred') {
                itemsToDisplay = currentItems.filter(item => starredLinks.includes(item.link));
            }

            // Obsługa wyszukiwarki na żywo w locie
            const query = document.getElementById('search-input').value.toLowerCase();
            if (query) {
                itemsToDisplay = itemsToDisplay.filter(item => item.text.toLowerCase().includes(query));
            }

            if (itemsToDisplay.length === 0) {
                list.innerHTML = activeTab === 'starred' 
                    ? '<li>Brak zapisanych wiadomości na potem. Kliknij gwiazdkę przy newsie, aby go zapisać!</li>' 
                    : '<li>Brak pasujących wiadomości.</li>';
                updateStats(0, currentItems.length);
                return;
            }

            itemsToDisplay.forEach((item) => {
                const li = document.createElement('li');
                
                const a = document.createElement('a');
                a.href = item.link || '#';
                a.target = '_blank';
                a.textContent = item.text;
                
                const actionsGroup = document.createElement('div');
                actionsGroup.className = 'actions-group';

                const starBtn = document.createElement('button');
                const isStarred = starredLinks.includes(item.link);
                starBtn.className = `star-btn ${isStarred ? 'starred' : ''}`;
                starBtn.textContent = isStarred ? '⭐' : '☆';
                starBtn.title = isStarred ? 'Usuń z ulubionych' : 'Zapisz na potem';
                starBtn.onclick = () => toggleStar(item.link);

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = 'Kopiuj';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(item.link);
                    copyBtn.textContent = 'Skopiowano!';
                    setTimeout(() => copyBtn.textContent = 'Kopiuj', 1500);
                };

                actionsGroup.appendChild(starBtn);
                actionsGroup.appendChild(copyBtn);

                li.appendChild(a);
                li.appendChild(actionsGroup);
                list.appendChild(li);
            });

            // Wyliczanie statystyk procentowych w oparciu o całą listę bieżącego wydania
            updateStats(itemsToDisplay.length, currentItems.length);
        }

        function updateStats(displayedCount, totalCount) {
            // Symulacja przeczytanych na podstawie odwiedzanych linków lub liczby wyświetlonych
            let percent = totalCount > 0 ? Math.round((displayedCount / totalCount) * 100) : 0;
            
            // Chwytliwe komentarze w zależności od postępu
            let comment = "Zaczynamy!";
            if (percent > 0 && percent <= 30) comment = "Jeszcze jeden news?";
            else if (percent > 30 && percent <= 75) comment = "Czytaj dalej!";
            else if (percent > 75 && percent < 100) comment = "Już prawie wszystko!";
            else if (percent >= 100 && totalCount > 0) comment = "Wszystko zaliczone!";

            document.getElementById('progress-text').textContent = `Wyświetlone: ${displayedCount}/${totalCount} (${percent}%)`;
            document.getElementById('comment-text').textContent = comment;
        }

        function filterNews() {
            renderNews();
        }

        init();
    </script>
</body>
</html>
