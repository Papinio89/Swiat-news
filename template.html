<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350, initial-scale=1.0">
    <title>Karuzela Newsowa</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 1080px;
            height: 1350px;
            background: linear-gradient(135deg, #070913 0%, #111827 100%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 70px 60px;
            overflow: hidden;
        }

        /* Nagłówek slajdu */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 25px;
        }
        .category {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #3b82f6;
            text-transform: uppercase;
        }
        .logo-text {
            font-size: 18px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 1.5px;
        }

        /* Sekcja główna z newsami */
        .content {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin: 20px 0;
        }

        .news-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 26px;
            display: flex;
            gap: 24px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .news-image {
            width: 130px;
            height: 130px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            background: #1e293b;
        }

        .news-text-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .news-title {
            font-size: 20px;
            font-weight: 700;
            color: #f1f5f9;
            line-height: 1.35;
        }

        .news-desc {
            font-size: 15px;
            font-weight: 400;
            color: #94a3b8;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Stopka slajdu */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid rgba(255, 255, 255, 0.08);
            padding-top: 25px;
        }
        .swipe-info {
            font-size: 16px;
            color: #64748b;
            font-weight: 600;
        }
        .slide-counter {
            font-size: 18px;
            font-weight: 700;
            background: #2563eb;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="category">{{ kategoria }}</div>
        <div class="logo-text">ŚWIAT W PIGUŁCE</div>
    </div>

    <div class="content">
        {% for news in newsy %}
        <div class="news-card">
            {% if news.zdjecie %}
            <img src="{{ news.zdjecie }}" class="news-image" alt="">
            {% endif %}
            <div class="news-text-box">
                <div class="news-title">{{ news.tytul }}</div>
                <div class="news-desc">{{ news.opis }}</div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="footer">
        <div class="swipe-info">Przesuń w bok, aby czytać dalej 👉</div>
        <div class="slide-counter">{{ slajd_akt }} / {{ slajd_max }}</div>
    </div>

</body>
</html>
