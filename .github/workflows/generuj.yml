name: Generator Karuzel AI

on:
  workflow_dispatch: # Pozwala uruchamiać skrypt ręcznie przyciskiem z telefonu
  push:
    paths:
      - 'archive.json' # Uruchamia się też automatycznie po aktualizacji pliku archive.json

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Uprawnienia niezbędne, aby skrypt mógł zapisać wygenerowane pliki PNG z powrotem do repozytorium
    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 jinja2 playwright

      - name: Instalacja silnika przeglądarki Playwright
        run: playwright install chromium

      - name: Uruchomienie skryptu generującego
        run: python main.py

      - name: Automatyczny zapis wygenerowanych PNG w repozytorium
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatycznie wygenerowane grafiki karuzel PNG"
          file_pattern: "*.png"
