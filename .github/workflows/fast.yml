name: Fast Update News

on:
  workflow_dispatch:
  schedule:
    # 04:00, 07:00, 13:00, 16:00 czasu polskiego (letniego CEST, UTC+2)
    # W czasie zimowym (CET, UTC+1) będzie to 03:00, 06:00, 12:00, 15:00
    - cron: '0 2,5,11,14 * * *'

permissions:
  contents: write

jobs:
  update-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast news script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python fast.py

      - name: Commit and push fast.json
        run: |
          git config --global user.name 'Bot Wiadomości'
          git config --global user.email 'bot@users.noreply.github.com'
          git add fast.json
          git diff --staged --quiet || git commit -m "Aktualizacja fast.json [skip ci]"
          git pull origin main --rebase
          git push origin main
