name: Auto Update News

on:
  schedule:
    - cron: '0 6,19 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # NAPRAWIONY BLOK: Instalacja zależności z pliku requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ten krok poniżej jest teraz zbędny, bo Pillow i reszta są w requirements.txt,
      # ale jeśli go zostawisz, też zadziała (nadpisze instalację).
      # Dla porządku możesz go usunąć lub zostawić.
      #- name: Install extra libraries
      #  run: pip install feedparser google-genai

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py

      # KLUCZOWA ZMIANA: Dodano *.png do listy plików dodawanych do Gita,
      # aby wygenerowane grafiki zostały zapisane w repozytorium.
      - name: Commit and push changes
        run: |
          git config --global user.name 'Bot Wiadomości'
          git config --global user.email 'bot@users.noreply.github.com'
          git add news.json archive.json *.png
          git commit -m "Automatyczna aktualizacja newsów i grafik [skip ci]" || exit 0
          git push
