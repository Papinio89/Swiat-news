name: Update News

on:
  schedule:
    # Codziennie o 6:00 UTC (8:00 CEST) – możesz zmienić
    - cron: "0 6 * * *"
  workflow_dispatch:   # pozwala uruchomić ręcznie z GitHuba

permissions:
  contents: write      # KONIECZNE do commita news.json i archive.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json archive.json
          git diff --staged --quiet || git commit -m "📰 Aktualizacja newsów $(date +'%Y-%m-%d %H:%M')"
          git push
